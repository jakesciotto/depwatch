[project]
name = "depwatch"
version = "0.1.0"
description = "Watches GitHub repos for dependency changes and writes a weekly digest into a markdown vault"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jake Sciotto" }]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "anthropic>=1.4,<2",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "apscheduler>=3.11,<4",
]

[project.urls]
Repository = "https://github.com/jakesciotto/depwatch"

[project.scripts]
depwatch = "depwatch.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
