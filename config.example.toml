# Copy to config.toml. Only [repos] is required. Secrets go in the environment or .env.

[repos]
# owner/name. GITHUB_TOKEN needs read access, plus Dependabot alerts read for advisories.
allowlist = [
  "your-user/app-one",
  "your-user/app-two",
]

# Optional. OSV.dev advisories for every npm and PyPI package the manifests and lockfiles pin, no token needed. Default true.
[advisories]
osv = true

# Optional. Without it, only `depwatch digest --dry-run` works and prints the note.
[vault]
# Git repo that receives one note per ISO week at <folder>/2026-W37.md. GITHUB_TOKEN must be able to push.
repo = "your-user/notes"
folder = "dependencies"
timezone = "UTC"
committer_name = "depwatch"
committer_email = "depwatch@localhost"

# Optional. Without it there are no summaries or breakage reads, and findings that would
# have needed a read are marked actionable.
[llm.tier1]
# Any OpenAI-compatible chat endpoint. Summarises every finding, so keep it cheap and local.
base_url = "http://localhost:8080/v1"
model = "chat"

[llm.tier2]
# "local" reuses an OpenAI-compatible endpoint. "anthropic" uses the Claude API and needs ANTHROPIC_API_KEY.
provider = "local"
base_url = "http://localhost:8080/v1"
model = "deep"
max_calls_per_run = 10
